<!doctype html>

    <nav class="navbar cell-city-navbar">

            <circle cx="24" cy="10" r="2" fill="#009fb0" />

        <ul class="navbar-nav cell-city-navbar__nav">

          <li class="nav-item">

          </li>
          <li class="nav-item">
            <a class="nav-link cell-city-navbar__link" href="missions.html">Missions</a>
          </li>
        </ul>
      </div>
    </nav>
    <main>
      <section>
        <h2>Bio Lab</h2>
        <p>Analyze DNA sequences in the Cell City Bioinformatics Lab.</p>
